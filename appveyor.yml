version: 1.39.Final.{build}
image: Visual Studio 2022
clone_depth: 1
clone_folder: c:\project\mediaportal

max_jobs: 4

environment:
  JAVA_HOME: C:\Program Files (x86)\Java\jdk1.8.0

configuration:
  - x86
  - x64

build:
  parallel: true

matrix:
  fast_finish: true

# Documentation / GitHub-only changes do not need an installer build
skip_commits:
  files:
    - '**/*.md'
    - .github/**

# NuGet packages restored by Build\RestorePackages.bat
cache:
  - Packages -> **\packages.config

install:
  - cmd: >-
      git submodule update --init --recursive

      choco install --yes nsis --version=3.11 --force

      java -version

      mkdir "C:\Program Files (x86)\Microsoft Visual Studio\2019\"

      mklink /J "C:\Program Files (x86)\Microsoft Visual Studio\2019\Community" "C:\Program Files\Microsoft Visual Studio\2022\Community"

build_script:
  - cmd: >-
      cd c:\project\mediaportal\build\

      BuildFullinstaller.cmd LOG %CONFIGURATION%

      7z a ..\Release\MediaPortalSetup_%CONFIGURATION%_%APPVEYOR_BUILD_VERSION%.%APPVEYOR_REPO_COMMIT%.zip ..\Release\MediaPortalSetup_*.exe

      7z a BuildFullInstaller_%CONFIGURATION%.zip BuildFullInstaller.log

after_build:
  # Native filters must keep ASLR, DEP and CFG (see DirectShowFilters\Directory.Build.props).
  # Enforced by the GitHub "Native Filters" workflow; reported as a warning here because the
  # installer build may copy third-party binaries into the filter output folders.
  - ps: |
      & "$Env:APPVEYOR_BUILD_FOLDER\Build\Check-NativeHardening.ps1" -Path "$Env:APPVEYOR_BUILD_FOLDER\DirectShowFilters"
      if ($LASTEXITCODE) { Add-AppveyorMessage "Native binaries without ASLR/DEP/CFG, see build log" -Category Warning }
      $global:LASTEXITCODE = 0

on_failure:
  # on_failure runs in the clone folder, not in Build\ where build_script left off
  - ps: |
      $log = Join-Path $Env:APPVEYOR_BUILD_FOLDER 'Build\BuildFullInstaller.log'
      if (Test-Path $log) { Push-AppveyorArtifact $log -FileName "BuildError_$Env:CONFIGURATION.log" }

artifacts:
  - path: Release\MediaPortalSetup_*.zip
    name: Mediaportal Installer
  - path: Build\BuildFullInstaller_*.zip
    name: Mediaportal Build Log

test: off

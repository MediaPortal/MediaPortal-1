name: Mediaportal / Test

on:
  push:
    branches:
      # Jira branches
      - 'MP1-**'
      # Pre Release / Final Test branches
      - 'MP1.**_Test**'
    # Ignore all Tags / Release
    tags-ignore:
      - '**'

  pull_request:
    branches:
      - master
      - 'MP1.**'
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

  workflow_dispatch:

  workflow_call:
    inputs:
      retention-logs:
        description: "Retention Period for Log files. Default is 3"
        default: 3
        required: false
        type: number
      retention-build:
        description: "Retention Period for Setup files. Default is 3, 7 for Test branches"
        required: false
        type: number

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Mediaportal Build
    uses: ./.github/workflows/mediaportal.yml
    with:
      retention-logs: ${{ inputs.retention-logs || 3 }}
      retention-build: ${{ inputs.retention-build || (contains(github.ref_name, '_Test') && 7) || 3 }}

  ci-status:
    name: Status
    runs-on: ubuntu-latest
    needs:
      - build
    if: always()
    steps:
      - name: Success
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failure
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

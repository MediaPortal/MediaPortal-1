name: Native Filters

on:
  pull_request:
    paths:
      - 'DirectShowFilters/**'
      - 'Build/Check-NativeHardening.ps1'
      - 'Build/Check-NoMfcAtl.ps1'
      - '.github/actions/setup-vcpkg/**'
      - '.github/workflows/native_filters.yml'

  push:
    branches:
      - master
      - 'MP1.**'
    paths:
      - 'DirectShowFilters/**'
      - 'Build/Check-NativeHardening.ps1'
      - 'Build/Check-NoMfcAtl.ps1'
      - '.github/actions/setup-vcpkg/**'
      - '.github/workflows/native_filters.yml'

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build DirectShowFilters (${{ matrix.platform }})

    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]

    runs-on: windows-2022

    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplets: ${{ matrix.platform == 'Win32' && 'x86-windows-mp' || 'x64-windows-mp' }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: Packages
          key: nuget-native-${{ hashFiles('DirectShowFilters/**/packages.config') }}

      - name: Restore NuGet packages
        run: >-
          nuget restore DirectShowFilters\Filters.sln
          -PackagesDirectory Packages
          -Source https://api.nuget.org/v3/index.json
          -Source https://www.myget.org/F/mediaportal/api/v3/index.json
          -NonInteractive

      - name: Build
        run: >-
          msbuild DirectShowFilters\Filters.sln /m /nologo /v:m
          /t:Build /p:Configuration=Release /p:Platform=${{ matrix.platform }}
          "/flp:logfile=Build\NativeFilters_${{ matrix.platform }}.log;verbosity=normal"

      - name: Check binary hardening (ASLR, DEP, CFG)
        shell: pwsh
        run: .\Build\Check-NativeHardening.ps1 -Path DirectShowFilters

      - name: Upload Artifact / Build log
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Native filters build log ${{ matrix.platform }}
          path: Build\NativeFilters_${{ matrix.platform }}.log
          retention-days: 3

      - name: Upload Artifact / Filters
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: Native filters ${{ matrix.platform }}
          path: |
            DirectShowFilters/**/Release/*.ax
            DirectShowFilters/**/Release/*.dll
            DirectShowFilters/**/Release/*.pdb
          retention-days: 7

  no-mfc-atl:
    name: No MFC or ATL in DirectShowFilters

    runs-on: windows-2022

    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Check for MFC and ATL
        run: pwsh -NoProfile -File Build/Check-NoMfcAtl.ps1 -Path DirectShowFilters

  tests:
    name: Tests of DirectShowFilters (CMake, x64 Unicode)

    # The first runs on the hosted runner are not trusted yet: the presets for Visual Studio 2022 were not run
    # locally (Visual Studio 2026 was), so a failure here does not block the pull request.
    continue-on-error: true

    runs-on: windows-2022

    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplets: x64-windows-mp

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: Packages
          key: nuget-native-${{ hashFiles('DirectShowFilters/**/packages.config') }}

      # DirectX 9 SDK (d3dx9, dxguid, DxErr) and libbluray come from NuGet
      - name: Restore NuGet packages
        run: >-
          nuget restore DirectShowFilters\Filters.sln
          -PackagesDirectory Packages
          -Source https://api.nuget.org/v3/index.json
          -Source https://www.myget.org/F/mediaportal/api/v3/index.json
          -NonInteractive

      - name: Configure
        working-directory: DirectShowFilters
        run: >-
          cmake --preset vs2022-x64-unicode
          -DMP_BUILD_TESTS=ON -DVCPKG_MANIFEST_FEATURES=tests

      - name: Build
        working-directory: DirectShowFilters
        run: >-
          cmake --build --preset vs2022-x64-unicode-release --parallel
          --target mp_unit_tests mp_integration_tests mp_tsmuxer_tests mp_tsreader_tests mp_tswriter_tests mpcSubs MPAudioSwitcher

      - name: Run tests
        working-directory: DirectShowFilters
        run: ctest --test-dir build/vs2022-x64-unicode -C Release -LE local --output-on-failure

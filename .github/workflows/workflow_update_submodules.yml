name: Workflow / Update Git Submodules to Latest Tag

on:
  workflow_dispatch:

jobs:
  update-submodules:
    name: Update Git Submodules to Latest Tag
    runs-on: ubuntu-latest

    steps:
      - name: ⤵️ Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: 🚀 Update submodules to latest tag
        id: submodules
        uses: sgoudham/update-git-submodules@v2.1.3

      - name: 📝 Create or update Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: "MP1: Update Git submodules to latest tag"
          commit-message: "MP1: Update all submodules"
          body: ${{ steps.submodules.outputs.prBody }}
          branch: update-submodules
